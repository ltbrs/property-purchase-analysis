[project]
name = "property-purchase-analysis-backend"
version = "0.1.0"
description = "API for source-backed French property purchase analysis"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.0,<2.0.0",
    "boto3>=1.40.0,<2.0.0",
    "fastapi>=0.116.0,<1.0.0",
    "openai>=2.0.0,<3.0.0",
    "pydantic-settings>=2.10.0,<3.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "python-multipart>=0.0.20,<1.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "uvicorn>=0.35.0,<1.0.0",
    "xberg>=1.0.14,<2.0.0",
    "slowapi>=0.1.10",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0,<1.0.0",
    "mypy>=1.17.0,<2.0.0",
    "pytest>=8.4.0,<10.0.0",
    "ruff>=0.12.0,<1.0.0",
]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "app.main:app"

[tool.vercel.scripts]
build = "python scripts/prepare_vercel_native.py"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

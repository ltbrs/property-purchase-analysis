services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-property_analysis}
      POSTGRES_USER: ${POSTGRES_USER:-property_analysis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-property_analysis}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  object-storage:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:-property_analysis}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:-change-this-local-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - object_storage_data:/data
    restart: unless-stopped

  object-storage-init:
    image: minio/mc:latest
    depends_on:
      object-storage:
        condition: service_started
    environment:
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-property_analysis}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-change-this-local-secret}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-property-documents}
    entrypoint: >-
      /bin/sh -c '
      until mc alias set local http://object-storage:9000
      "$${OBJECT_STORAGE_ACCESS_KEY}" "$${OBJECT_STORAGE_SECRET_KEY}";
      do sleep 1; done &&
      mc mb --ignore-existing "local/$${OBJECT_STORAGE_BUCKET}" &&
      mc anonymous set none "local/$${OBJECT_STORAGE_BUCKET}"
      '

volumes:
  postgres_data:
  object_storage_data:
